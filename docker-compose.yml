services:
  mikrotik-ai-mcp:
    build: .
    container_name: mikrotik-ai-mcp
    restart: unless-stopped
    ports:
      - "8282:8080"   # painel web local
    environment:
      ADMIN_PASSWORD: "troque-esta-senha"
      DATA_DIR: "/data"
      WEB_PORT: "8080"
      MCP_PORT: "8000"
    volumes:
      - mikrotik-ai-data:/data

volumes:
  mikrotik-ai-data:
